[pytest]
timeout = 300
addopts = --import-mode=importlib -vvs -rA
empty_parameter_set_mark = skip
testpaths = qwen36_resident/tests
markers =
    timeout: per-test timeout in seconds
    use_module_device(device_params): use module-scoped device fixture
    requires_grid_size(min_x, min_y) or min_cores: skip if the worker grid is smaller
