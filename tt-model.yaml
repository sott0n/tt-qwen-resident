# Container (v5.1) package of the resident Qwen3.6-27B for tt-model:
#   tt-model package --container tt-model.yaml --out ~/tt-model-builds
schema: "5.1"

repo: kyamaguchiTT/qwen3.6-27b-resident-p150x4
name: qwen3.6-27b-resident
weights: {repo: Qwen/Qwen3.6-27B, revision: 6a9e13bd6fc8f0983b9b99948120bc37f49c13e9}
kind: vllm-plugin
arch: blackhole

source:
  # the submodule with patches/ applied: the prefill needs the patched chunk_gated_delta_rule op
  tt_metal: /home/kyamaguchi/tt-qwen-resident/tt-metal
  code:
    - models/common                                   # utility_functions, imported by tp_common
    - models/demos/blackhole/qwen36/tt/tp_common.py   # prefill MLP matmul program configs
  extra_code:
    - root: /home/kyamaguchi/tt-qwen-resident
      paths:
        - qwen36_resident/__init__.py
        - qwen36_resident/common.py
        - qwen36_resident/model.py
        - qwen36_resident/weights.py
        - qwen36_resident/generator_vllm.py
        - qwen36_resident/mtp.py                       # imported by generator_vllm (the MTP serving class)
        - qwen36_resident/kernels                     # JIT-compiled at serve time
        - qwen36_resident/prefill
        - qwen36_resident/vllm_models                 # covers extra_models_dir
  ubuntu: "22.04"
  python: "3.10"

runtime:
  vllm: {version: "0.26.0"}
  plugin: {path: /home/kyamaguchi/vllm-tt-plugin}     # at 3506696, the validated commit
  extra_models_dir: qwen36_resident/vllm_models

serve:
  hardware: p150x4
  mesh_device: P150x4
  max_num_seqs: 1          # the prefill hands its state to a batch-1 decode model only
  block_size: 64
  max_model_len: 32768
  additional_config:
    tt:
      trace_region_size: 134217728   # decode trace plus one prefill trace per chunk size
      sample_on_device_mode: decode_only   # greedy decode steps read the device argmax
  args: [--async-scheduling]   # greedy steps are submitted before the previous token is read back

serve_profiles:
  - name: default
    description: One user, any sampling.
  - name: mtp
    description: One user, greedy only, MTP speculative decode (about 1.45x the decode speed).
    env:
      TT_MODEL_CLASS_OVERRIDES: "TTQwen3_5ForConditionalGeneration=qwen36_resident.generator_vllm:Qwen36ResidentMTPForCausalLM"
default_profile: default

verify:
  - "from qwen36_resident.generator_vllm import Qwen36ResidentForCausalLM; assert Qwen36ResidentForCausalLM"
  - "from qwen36_resident.generator_vllm import Qwen36ResidentMTPForCausalLM; assert Qwen36ResidentMTPForCausalLM"
  - "from pathlib import Path; assert Path('/opt/tt-metal/qwen36_resident/kernels/streamer_reader.cpp').is_file(), 'decode kernels missing'"
  - "from pathlib import Path; assert Path('/opt/tt-metal/qwen36_resident/prefill/kernels/handoff.cpp').is_file(), 'prefill kernels missing'"

card:
  description: >
    Qwen3.6-27B on four Blackhole P150 chips with a resident decode design: one persistent program per
    chip runs the whole decode step, and a pipeline-parallel prefill hands its state to it on device.
  performance: |
    Served through vLLM by this package on p150x4: one user, greedy, 128 generated tokens, measured
    from a streaming client.

    | Prompt (tokens) | Time to first token | Decode |
    | --- | --- | --- |
    | 128 | 0.17 s | 83 tok/s (12.0 ms/token) |
    | 2,048 | 0.45 s | 83 tok/s (12.1 ms/token) |
    | 8,192 | 1.16 s | 81 tok/s (12.3 ms/token) |
    | 32,000 | 4.56 s | 74 tok/s (13.6 ms/token) |

    Token accuracy, teacher-forced against the Hugging Face reference (512 scored tokens): 99.41% top-1,
    100% top-5.

    The `mtp` profile (`tt-model serve --profile mtp ...`) adds MTP speculative decode with the
    checkpoint's MTP layer: one user, greedy, 256 generated tokens, chat template with thinking on.

    | Prompt (tokens) | Time to first token | Decode |
    | --- | --- | --- |
    | 21-60 (chat) | 0.27-0.29 s | 118-125 tok/s |
    | 8,211 | 1.37 s | 110 tok/s |
    | 32,020 | 4.65 s | 101 tok/s |

    Its output equals greedy decode of its verify step token for token; it can differ from the
    default profile's greedy output where two logits tie in bf16.
  limitations: >
    One user at a time (max_num_seqs 1). Text only: image and video input are not supported. Served
    context is 32,768 tokens. The decode speed above holds for greedy requests (temperature 0 or
    top_k 1, no penalties or logprobs): they are sampled on device and run asynchronously. Any other
    request samples on the host from the full logits and runs synchronously: about 60 tok/s measured
    on that path with greedy requests; stochastic sampling itself was not measured. The `mtp` profile
    serves greedy requests only: any other request fails at its first decode step.
  architecture: 27B dense hybrid (48 Gated DeltaNet + 16 full-attention layers)
  status: Experimental
  out_of_scope_use: Image or video input; this port serves the language model only.
  license: {id: apache-2.0}
